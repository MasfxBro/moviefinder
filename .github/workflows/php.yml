name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Node ${{ matrix.node }} / MySQL 8.4
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ["8.5"]
        node: ["26"]   # Node 26 LTS (promoted late October 2026); update to next LTS when available

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: moviefinder_test
          MYSQL_USER: moviefinder
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ------------------------------------------------------------------ #
      # PHP dependencies                                                     #
      # ------------------------------------------------------------------ #

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # ------------------------------------------------------------------ #
      # JS dependencies and frontend build                                  #
      # ------------------------------------------------------------------ #

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # ------------------------------------------------------------------ #
      # Application environment                                             #
      # ------------------------------------------------------------------ #

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      # ------------------------------------------------------------------ #
      # Code quality                                                        #
      # ------------------------------------------------------------------ #

      - name: Run Pint (lint)
        run: vendor/bin/pint --test

      - name: Run Larastan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress

      # ------------------------------------------------------------------ #
      # Tests                                                               #
      # ------------------------------------------------------------------ #

      - name: Run migrations on test database
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: moviefinder_test
          DB_USERNAME: moviefinder
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Run Pest test suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: moviefinder_test
          DB_USERNAME: moviefinder
          DB_PASSWORD: secret
          AI_DRIVER: fake
        run: php artisan test --compact

      # ------------------------------------------------------------------ #
      # Security audits                                                     #
      # ------------------------------------------------------------------ #

      - name: Composer security audit
        run: composer audit

      - name: npm security audit
        run: npm audit --audit-level=high
